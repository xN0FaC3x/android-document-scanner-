name: Build Android APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download & Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O gradle-bin.zip
          unzip -q gradle-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docscan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Publish to GitHub Releases
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          if [ -f "$APK_FILE" ]; then
            TAG="v1.0.${{ github.run_number }}"
            gh release create "$TAG" "$APK_FILE" \
              --title "DocScan APK (Build ${{ github.run_number }})" \
              --notes "Tap the .apk file on your Android phone to install." \
              --latest || true
          fi
